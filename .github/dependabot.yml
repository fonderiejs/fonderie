# Dependency update automation (SOC 2 CC7.1 — vulnerability management).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk updates so PR volume stays manageable.
      dev-and-minor:
        update-types: [minor, patch]
    # react-native uses 0.x semver where a "minor" bump is a breaking release
    # requiring a real migration (and @types/react-native is a deprecated stub
    # superseded by RN's bundled types). Grouping them poisoned the whole
    # dev-and-minor PR (#40). Track the RN upgrade in its own dedicated PR.
    ignore:
      - dependency-name: react-native
      - dependency-name: "@types/react-native"
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
