name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

# Least privilege — CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test process otherwise burns the 6-hour default before anyone
    # notices. The job's own worst case is ~12 minutes.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fonderie_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Enables the gated real-engine concurrency tests in @fonderie/rate-limit.
      RATE_LIMIT_PG_URL: postgres://postgres:postgres@localhost:5432/fonderie_test
      RATE_LIMIT_REDIS_URL: redis://localhost:6379
      # Enables the gated wallet atomicity tests in @fonderie/billing.
      BILLING_PG_URL: postgres://postgres:postgres@localhost:5432/fonderie_test
      # Enables the gated claiming/lease tests in @fonderie/events. These need a
      # real Postgres: SKIP LOCKED and the visibility lease are behaviours of the
      # database, and a mocked store will happily "prove" an invariant it does
      # not actually provide.
      EVENTS_PG_URL: postgres://postgres:postgres@localhost:5432/fonderie_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      # Lint shipped code (packages/) at error severity — fast, no build needed.
      - run: npm run lint:ci
      # Security gate: fail on high+ advisories in what Fonderie actually ships —
      # excluding dev tooling and peer deps (express etc.) the consuming app owns.
      - run: npm run audit:ship
      - run: npm run build
      # Strict full-project typecheck (tsc --noEmit) — build is tsup bundling,
      # not a substitute for this. Runs after build so turbo has upstream dts.
      - run: npm run typecheck
      # Gate the central signatures AND the co-located per-package fragments
      # (packages/*/brain) — docs:signatures writes both, and a stale fragment
      # would otherwise publish inside the tarball, drifting from the shipped
      # code and breaking R3's version-matched-by-construction guarantee.
      - run: npm run docs:signatures && git diff --exit-code .claude/skills/fonderie/SIGNATURES.md .claude/skills/fonderie/signatures 'packages/*/brain/*'
      - run: npm run docs:brain && git diff --exit-code .claude/skills/fonderie/brain.json packages/cli/data/knowledge.json
      - run: npm run brain:test
      - run: npm run brain:project-test
      - run: node packages/cli/bin/fonderie.test.mjs
      - run: npm run audit:validation
      # SOC 2 control-matrix drift guard — every cited evidence path must exist.
      - run: npm run check:evidence
      - run: npm run check:hook-coverage
      - run: npm run check:hook-parity
      # Client<->server route drift guard — every @fonderie/client path must map
      # to a route registered by its server package.
      - run: npm run check:routes
      # Notification-template coverage guard — every module that defines
      # customer-notification MESSAGE_KEYS must ship default templates for them.
      - run: npm run check:template-coverage
      # NODE_OPTIONS names whatever keeps a test process alive after its suite
      # has finished — the failure where every suite reports green, turbo never
      # summarises, and the job idles to its timeout. Absolute path because
      # turbo spawns each package with its own cwd, so a relative --import
      # resolves to nothing for all but the root. Silent unless something is
      # still alive at the deadline; see scripts/dump-handles.mjs.
      - run: npm test
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/dump-handles.mjs
      # Reference example apps (examples/*) are standalone — they pin the
      # published @fonderie/* packages so they stay Vercel-deployable. Here we
      # want THIS commit's code, so the pinned deps come out before the install
      # and resolution falls through to the in-repo workspace packages built
      # above. Pure unit tests, no DB.
      #
      # Removing them before the install rather than after is the point.
      # Fetching them was never useful — they were deleted a line later — and
      # it was the only thing in this step that could fail: mid-release the
      # registry is briefly inconsistent, a dependent published ahead of its
      # dependency, and the install ERESOLVEd on a peer range between two
      # published versions, neither of which is the code under test. That
      # reddened main after a release rather than for a commit.
      - name: Test example apps (against in-repo packages)
        run: |
          for e in examples/example-hono examples/example-express examples/example-koa; do
            echo "== $e =="
            ( cd "$e" \
              && npm pkg delete $(node -p 'Object.keys(require("./package.json").dependencies).filter(k=>k.startsWith("@fonderie/")).map(k=>"dependencies."+k).join(" ")') \
              && npm install --no-audit --no-fund \
              && npm test )
          done
          # The examples ship without a lockfile; npm writes one. Leave none.
          git checkout -- examples && git clean -qfd examples
