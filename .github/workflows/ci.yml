name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

# Least privilege — CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test process otherwise burns the 6-hour default before anyone
    # notices. The job's own worst case is ~12 minutes.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fonderie_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Enables the gated real-engine concurrency tests in @fonderie/rate-limit.
      RATE_LIMIT_PG_URL: postgres://postgres:postgres@localhost:5432/fonderie_test
      RATE_LIMIT_REDIS_URL: redis://localhost:6379
      # Enables the gated wallet atomicity tests in @fonderie/billing.
      BILLING_PG_URL: postgres://postgres:postgres@localhost:5432/fonderie_test
      # Enables the gated claiming/lease tests in @fonderie/events. These need a
      # real Postgres: SKIP LOCKED and the visibility lease are behaviours of the
      # database, and a mocked store will happily "prove" an invariant it does
      # not actually provide.
      EVENTS_PG_URL: postgres://postgres:postgres@localhost:5432/fonderie_test
      # Enables the gated operator sign-in tests in @fonderie/admin: claim
      # locking, single-use links, backup-code consumption and the TOTP replay
      # guard are conditional UPDATEs a mocked store cannot prove.
      ADMIN_PG_URL: postgres://postgres:postgres@localhost:5432/fonderie_test
      # Enables the gated locale-resolution tests in @fonderie/courier: the chain
      # lookup is an ANY() array match with case-insensitive legacy rows, which
      # a mocked store only emulates.
      COURIER_PG_URL: postgres://postgres:postgres@localhost:5432/fonderie_test
      # @fonderie/sse: PgBroadcaster fan-out across two LISTEN connections, and a
      # brick's own NOTIFY (config changed) reaching a live stream.
      SSE_PG_URL: postgres://postgres:postgres@localhost:5432/fonderie_test
      # @fonderie/auth: refresh rotation — hashed at rest, the grace for racing
      # refreshes, and reuse detection are conditional UPDATEs on real rows.
      AUTH_PG_URL: postgres://postgres:postgres@localhost:5432/fonderie_test
      # @fonderie/workspaces: invitations and membership — one pending invite
      # per address (unique index), single-use links, seat counts, ownership.
      WORKSPACES_PG_URL: postgres://postgres:postgres@localhost:5432/fonderie_test
      # @fonderie/customers: the permission guard on customer routes — with,
      # without, the default role, and a removed grant, through real joins.
      CUSTOMERS_PG_URL: postgres://postgres:postgres@localhost:5432/fonderie_test
      # @fonderie/media: the account-deletion eraser — an avatar's row and its
      # bytes (DbBlob) both go; an upload for a workspace stays, pseudonymized.
      MEDIA_PG_URL: postgres://postgres:postgres@localhost:5432/fonderie_test
      # @fonderie/webhooks: the account-deletion eraser redacts the person from
      # delivery payloads and echoed response bodies — JSON text matching a
      # mocked store cannot prove precise.
      WEBHOOKS_PG_URL: postgres://postgres:postgres@localhost:5432/fonderie_test
      # @fonderie/config: a config kind check and a secret-key rotation racing
      # writes — advisory locks a mocked store cannot prove. Runs in its own
      # schema, since a rotation touches every secret.
      CONFIG_PG_URL: postgres://postgres:postgres@localhost:5432/fonderie_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      # Lint shipped code (packages/) at error severity — fast, no build needed.
      - run: npm run lint:ci
      # Security gate: fail on high+ advisories in what Fonderie actually ships —
      # excluding dev tooling and peer deps (express etc.) the consuming app owns.
      - run: npm run audit:ship
      - run: npm run build
      # Strict full-project typecheck (tsc --noEmit) — build is tsup bundling,
      # not a substitute for this. Runs after build so turbo has upstream dts.
      - run: npm run typecheck
      # Gate the central signatures AND the co-located per-package fragments
      # (packages/*/brain) — docs:signatures writes both, and a stale fragment
      # would otherwise publish inside the tarball, drifting from the shipped
      # code and breaking R3's version-matched-by-construction guarantee.
      - run: npm run docs:signatures && git diff --exit-code .claude/skills/fonderie/SIGNATURES.md .claude/skills/fonderie/signatures 'packages/*/brain/*'
      - run: npm run docs:brain && git diff --exit-code .claude/skills/fonderie/brain.json packages/cli/data/knowledge.json
      - run: npm run brain:test
      - run: npm run brain:project-test
      - run: node packages/cli/bin/fonderie.test.mjs
      - run: npm run audit:validation
      # SOC 2 control-matrix drift guard — every cited evidence path must exist.
      - run: npm run check:evidence
      - run: npm run check:hook-coverage
      - run: npm run check:hook-parity
      # Client<->server route drift guard — every @fonderie/client path must map
      # to a route registered by its server package.
      - run: npm run check:routes
      # Notification-template coverage guard — every module that defines
      # customer-notification MESSAGE_KEYS must ship default templates for them.
      - run: npm run check:template-coverage
      # Console-reason guard — every finding reason a brick emits has a sentence in
      # the console dictionary, and every sentence is still emitted.
      - run: npm run check:reasons
      # Env-declaration guard — every brick's env.json names each process.env it
      # reads, and every variable it calls direct is really read.
      - run: npm run check:env-declarations
      # Migration-filename guard — fonderie_migrations is keyed by filename only,
      # so a name shipped by two bricks would be skipped forever on the second.
      - run: npm run check:migration-names
      # Lockfile guard — `changeset version` bumps package.json files but not the
      # lockfile, so workspace versions in package-lock.json drifted for weeks
      # and every local `npm install` rewrote it. The version script now syncs it;
      # this fails the PR that lets it drift again.
      - run: npm run check:lockfile
      - run: npm run check:internal-ranges
      # CI-env guard — a *_URL set above but not passed through turbo.json
      # silently skips its gated tests (admin and courier did, for weeks).
      - run: npm run check:ci-env
      # NODE_OPTIONS names whatever keeps a test process alive after its suite
      # has finished — the failure where every suite reports green, turbo never
      # summarises, and the job idles to its timeout. Absolute path because
      # turbo spawns each package with its own cwd, so a relative --import
      # resolves to nothing for all but the root. Silent unless something is
      # still alive at the deadline; see scripts/dump-handles.mjs.
      - run: npm test
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/dump-handles.mjs
          # Without this the handle dump from a HUNG task is never printed.
          #
          # turbo's --log-order defaults to `auto`, which is `grouped` in CI:
          # a task's output is buffered and flushed WHEN THE COMMAND FINISHES.
          # A task that hangs never finishes, so its buffer is never flushed —
          # which is why every dump so far showed only `npm test` and `turbo
          # test` (the two processes whose stderr goes straight to the job log)
          # and never the package-level process actually holding things open.
          #
          # That absence was read for six release cycles as "every child has
          # exited, so turbo holds a dead handle". The children were alive and
          # instrumented; their output was simply in a buffer.
          TURBO_LOG_ORDER: stream
      # Reference example apps (examples/*) are standalone — they pin the
      # published @fonderie/* packages so they stay Vercel-deployable. Here we
      # want THIS commit's code, so the pinned deps come out before the install
      # and resolution falls through to the in-repo workspace packages built
      # above. Pure unit tests, no DB.
      #
      # Removing them before the install rather than after is the point.
      # Fetching them was never useful — they were deleted a line later — and
      # it was the only thing in this step that could fail: mid-release the
      # registry is briefly inconsistent, a dependent published ahead of its
      # dependency, and the install ERESOLVEd on a peer range between two
      # published versions, neither of which is the code under test. That
      # reddened main after a release rather than for a commit.
      - name: Test example apps (against in-repo packages)
        run: |
          for e in examples/example-hono examples/example-express examples/example-koa; do
            echo "== $e =="
            ( cd "$e" \
              && npm pkg delete $(node -p 'Object.keys(require("./package.json").dependencies).filter(k=>k.startsWith("@fonderie/")).map(k=>"dependencies."+k).join(" ")') \
              && npm install --no-audit --no-fund \
              && npm test )
          done
          # The examples ship without a lockfile; npm writes one. Leave none.
          git checkout -- examples && git clean -qfd examples
