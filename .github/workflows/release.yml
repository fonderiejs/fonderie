# Release — token-free npm publish via OIDC Trusted Publishing.
#
# GitHub Actions exchanges its short-lived OIDC identity (`id-token: write`)
# directly with npm — no long-lived NPM_TOKEN, and provenance is generated
# automatically. Each published @fonderie/* package has a Trusted Publisher
# configured on npmjs.com pointing at this repo + this workflow filename
# (release.yml). A package missing that config will fail to publish, since there
# is no token fallback here.

name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC identity for npm Trusted Publishing (+ provenance)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm ≥ 11.5.1; pin the exact minor so the
      # publish env is deterministic regardless of the Node image's bundled npm.
      - run: npm install -g npm@^11

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Opens/updates the "Version Packages" PR when changesets are pending;
      # publishes to npm when that PR is merged. With OIDC there is NO
      # NODE_AUTH_TOKEN / NPM_TOKEN — npm authenticates via the job's id-token,
      # and provenance is emitted automatically (no NPM_CONFIG_PROVENANCE needed).
      - id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # `version-script` regenerates brain.json after the bumps so its
          # sdkVersions match the new package versions — otherwise the
          # docs:brain freshness gate fails on the very next push (learned the
          # hard way, 2026-07-20). NB: v2 renamed the inputs version->version-script
          # and publish->publish-script.
          version-script: npm run version
          publish-script: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN / NPM_TOKEN / NPM_CONFIG_PROVENANCE — Trusted
          # Publishing supplies auth and provenance from the OIDC id-token.

      # changesets marks the last-created per-package release as Latest —
      # arbitrary in a multi-package batch. Re-point it at the flagship.
      # Best-effort: a presentation tweak must never fail the publish.
      - name: Surface the flagship release as Latest
        if: steps.changesets.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLAGSHIP: '@fonderie/billing'
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          tag=$(node -e "const p=JSON.parse(process.env.PUBLISHED||'[]');const f=p.find(x=>x.name===process.env.FLAGSHIP);if(f)process.stdout.write(f.name+'@'+f.version)")
          if [ -n "$tag" ]; then
            echo "Marking $tag as the Latest release"
            gh release edit "$tag" --latest --repo "$GITHUB_REPOSITORY"
          else
            echo "Flagship $FLAGSHIP not published in this batch — leaving GitHub's default Latest."
          fi
