# Software Bill of Materials (SOC 2 CC7.1 — supply-chain transparency).
# Generates a CycloneDX SBOM of the shipped dependency surface and uploads it
# as a build artifact on each push to main and on demand.
name: SBOM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # cyclonedx-npm runs `npm ls --omit=dev`, which needs the workspace
      # file: links actually installed — without this the SBOM step fails with
      # ELSPROBLEMS "missing: @fonderie/* required by @fonderie/sdk".
      - run: npm ci
      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --omit dev --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
